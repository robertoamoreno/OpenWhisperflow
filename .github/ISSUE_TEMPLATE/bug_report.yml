name: Bug report
description: Report something broken in OpenWhisperflow
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, private transcripts, screenshots, recordings, or sensitive logs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Keep this minimal and remove sensitive content.
      placeholder: |
        1. Open Settings
        2. Select ...
        3. Press ...
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "Example: macOS 15.2"
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "Example: 22.12.0"
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove secrets, transcripts, screenshots, and private paths before pasting.
      render: text
