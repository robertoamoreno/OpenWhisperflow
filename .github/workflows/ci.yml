name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild Electron native modules
        run: npm run rebuild:native

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Electron app
        run: npm run build

      - name: Build Swift hotkey helper
        run: npm run build:hotkey-helper
